<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Simplified for small sizes: the in-app Logo keeps the fine cashback loop,
       but at 16px only a bold tick and a chunky arrowhead stay legible. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97a4d"/>
      <stop offset="60%" stop-color="#e8532f"/>
      <stop offset="100%" stop-color="#c62f14"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <path d="M11 25 L20 34 L33.5 15.5"
        fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41 8.5 L39.5 21.5 L28.5 15 Z" fill="#fff"/>
</svg>
